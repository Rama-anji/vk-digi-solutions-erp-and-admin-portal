services:
  - type: web
    name: vkd-erp-portal
    runtime: docker
    plan: free
    healthCheckPath: /api/index.php?action=session
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@vkdsolutions.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: PORT
        value: "10000"
